name: Release and Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_message:
        description: 'Deployment message'
        required: false
        default: 'Production release and deployment'
        type: string
      skip_release:
        description: 'Skip release creation (deploy current version only)'
        required: false
        default: false
        type: boolean
      release_type:
        description: 'Force specific release type (leave empty for auto-detect)'
        required: false
        default: ''
        type: choice
        options:
          - '' # Auto-detect from commits
          - 'patch'
          - 'minor'
          - 'major'
          - 'alpha'

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # Validation job - runs tests and build before creating release
  validate:
    runs-on: ubuntu-latest
    name: Validate Code
    if: ${{ github.event.inputs.skip_release != 'true' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install and test backend
        working-directory: ./backend
        run: |
          echo "📦 Installing backend dependencies..."
          npm ci
          echo "🧪 Running backend tests..."
          npm test
          echo "🔨 Building backend..."
          npm run build
          
      - name: Install and build frontend
        working-directory: ./frontend
        env:
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
        run: |
          echo "📦 Installing frontend dependencies..."
          npm ci
          echo "🔨 Building frontend..."
          npm run build
          
      - name: Success message
        run: |
          echo "✅ All tests passed and builds succeeded!"
          echo "### ✅ Validation Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Backend tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend build: ✅ Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build: ✅ Succeeded" >> $GITHUB_STEP_SUMMARY

  release:
    needs: [validate]
    runs-on: ubuntu-latest
    name: Create Release
    if: ${{ github.event.inputs.skip_release != 'true' && needs.validate.result == 'success' }}
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      release_created: ${{ steps.version.outputs.release_created }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: Check for unreleased changes
        id: check
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tags found, will create first release"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            # Check if there are new commits since last tag
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline)
            if [ -z "$COMMITS" ]; then
              echo "No new commits since last release ($LAST_TAG)"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            else
              echo "Found new commits since $LAST_TAG:"
              echo "$COMMITS"
              echo "has_changes=true" >> $GITHUB_OUTPUT
            fi
          fi
          
      - name: Create release
        id: version
        if: steps.check.outputs.has_changes == 'true'
        run: |
          # Determine release command based on input
          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          
          if [ -z "$RELEASE_TYPE" ]; then
            echo "Auto-detecting version bump from commits..."
            RELEASE_CMD="npm run release"
          elif [ "$RELEASE_TYPE" = "alpha" ]; then
            echo "Creating alpha release..."
            RELEASE_CMD="npm run release:alpha"
          else
            echo "Creating $RELEASE_TYPE release..."
            RELEASE_CMD="npm run release:$RELEASE_TYPE"
          fi
          
          # Run standard-version
          $RELEASE_CMD
          
          # Get the new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "release_created=true" >> $GITHUB_OUTPUT
          echo "✅ Created release v$NEW_VERSION"
          
      - name: Push changes
        if: steps.version.outputs.release_created == 'true'
        run: |
          git push --follow-tags origin main
          echo "📦 Pushed release v${{ steps.version.outputs.new_version }} to GitHub"
          
      - name: Skip release
        if: steps.check.outputs.has_changes != 'true'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "release_created=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No changes to release, will deploy current version: v$CURRENT_VERSION"

  # Separate validation for deploy-only (when skip_release is true)
  validate_deploy_only:
    runs-on: ubuntu-latest
    name: Validate Code (Deploy Only)
    if: ${{ github.event.inputs.skip_release == 'true' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install and test backend
        working-directory: ./backend
        run: |
          echo "📦 Installing backend dependencies..."
          npm ci
          echo "🧪 Running backend tests..."
          npm test
          echo "🔨 Building backend..."
          npm run build
          
      - name: Install and build frontend
        working-directory: ./frontend
        env:
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
        run: |
          echo "📦 Installing frontend dependencies..."
          npm ci
          echo "🔨 Building frontend..."
          npm run build
          
      - name: Success message
        run: |
          echo "✅ All tests passed and builds succeeded!"
          echo "### ✅ Validation Successful (Deploy Only)" >> $GITHUB_STEP_SUMMARY
          echo "- Backend tests: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend build: ✅ Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build: ✅ Succeeded" >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: [release, validate_deploy_only]
    # Run if either path succeeded (release path or deploy-only path)
    # IMPORTANT: Must use always() because only one of the needed jobs runs in each scenario
    # GitHub Actions skips jobs when any dependency doesn't run, even with conditional logic
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        (github.event.inputs.skip_release != 'true' && needs.release.result == 'success') ||
        (github.event.inputs.skip_release == 'true' && needs.validate_deploy_only.result == 'success')
      )
    runs-on: ubuntu-latest
    name: Deploy to Production
    environment:
      name: production
      url: https://budget.jaredcarrano.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main # Ensure we have the latest including any release commits
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Get deployment version
        id: deploy_version
        run: |
          # Get version from package.json (will be updated if release was created)
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🚀 Deploying version: v$VERSION"
          
      - name: Build backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build
          
      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_GOOGLE_PLACES_API_KEY: ${{ secrets.VITE_GOOGLE_PLACES_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Create deployment package
        run: |
          # Create package structure
          mkdir -p deployment/backend deployment/frontend

          # Copy backend - preserve directory structure
          cp -r backend/dist deployment/backend/
          cp backend/package*.json deployment/backend/

          # Copy CHANGELOG.md to deployment root for changelog endpoint
          cp CHANGELOG.md deployment/
          
          # Copy shared utilities to root level (matches import path ../../../shared)
          if [ -d backend/dist/shared ]; then
            cp -r backend/dist/shared deployment/shared
          else
            echo "⚠️ Warning: No shared utilities found in backend/dist/shared"
          fi
          
          # Copy frontend
          cp -r frontend/dist/* deployment/frontend/
          
          # Generate NON-SECRET configuration only (SA-25).
          #
          # Secrets are NOT written here and never enter the deployment package.
          # They live in SSM Parameter Store under /budget-app/prod/* and are
          # fetched by scripts/deploy-server.sh at deploy time, so the tarballs
          # retained in S3 are no longer credential bundles at rest.
          #
          # To change a secret: update the GitHub Secret, then run the
          # "Sync Secrets to SSM Parameter Store" workflow.
          # To change anything below: update the GitHub Variable and redeploy.
          #
          # ENCRYPTION_KEY is deliberately gone (SA-30) — no code ever read it,
          # and having two similarly-named "encryption key" secrets invited
          # rotating PLAID_ENCRYPTION_SECRET by mistake, which would orphan
          # every linked bank.
          cat > deployment/backend/.env.config << EOF
          NODE_ENV=${{ vars.PRODUCTION_NODE_ENV }}
          PORT=${{ vars.PRODUCTION_PORT }}
          JWT_EXPIRES_IN=${{ vars.PRODUCTION_JWT_EXPIRES_IN }}
          PLAID_ENV=${{ vars.PRODUCTION_PLAID_ENV }}
          PLAID_PRODUCTS=${{ vars.PRODUCTION_PLAID_PRODUCTS }}
          PLAID_COUNTRY_CODES=${{ vars.PRODUCTION_PLAID_COUNTRY_CODES }}
          DATA_DIR=${{ vars.PRODUCTION_DATA_DIR }}
          STORAGE_TYPE=${{ vars.PRODUCTION_STORAGE_TYPE }}
          S3_BUCKET_NAME=${{ vars.PRODUCTION_S3_BUCKET_NAME }}
          S3_PREFIX=${{ vars.PRODUCTION_S3_PREFIX }}
          AWS_REGION=${{ vars.PRODUCTION_AWS_REGION }}
          FRONTEND_URL=${{ vars.PRODUCTION_FRONTEND_URL }}
          API_PREFIX=${{ vars.PRODUCTION_API_PREFIX }}
          LOG_LEVEL=${{ vars.PRODUCTION_LOG_LEVEL }}
          CHATBOT_MONTHLY_LIMIT=${{ vars.PRODUCTION_CHATBOT_MONTHLY_LIMIT }}
          DEPLOYMENT_VERSION=${{ steps.deploy_version.outputs.version }}
          EOF

          # Add metadata
          echo "$GITHUB_SHA" > deployment/REVISION
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deployment/TIMESTAMP
          echo "${{ steps.deploy_version.outputs.version }}" > deployment/VERSION
          
          # Validate deployment package structure
          echo "🔍 Validating deployment package..."
          test -f deployment/backend/dist/index.js || (echo "❌ Backend entry point missing" && exit 1)
          test -d deployment/shared/utils || (echo "❌ Shared utilities directory missing" && exit 1)
          test -f deployment/shared/utils/categoryHelpers.js || (echo "❌ CategoryHelpers missing from shared utilities" && exit 1)
          test -f deployment/CHANGELOG.md || (echo "❌ CHANGELOG.md missing from deployment package" && exit 1)
          test -f deployment/backend/.env.config || (echo "❌ .env.config missing from deployment package" && exit 1)

          # SA-25 regression guard: fail the build if a secret ever finds its
          # way back into the package. Checks for the variable NAMES, so it
          # cannot itself leak a value. If this trips, something re-added a
          # secret to the .env.config heredoc above — put it in SSM instead.
          echo "  Checking package contains no secrets..."
          for FORBIDDEN in JWT_SECRET PLAID_SECRET PLAID_CLIENT_ID PLAID_ENCRYPTION_SECRET ANTHROPIC_API_KEY GITHUB_ISSUES_PAT VAPID_PRIVATE_KEY ENCRYPTION_KEY; do
            if grep -rq "^${FORBIDDEN}=" deployment/backend/.env.config 2>/dev/null; then
              echo "❌ $FORBIDDEN is present in the deployment package — secrets must come from SSM (SA-25)"
              exit 1
            fi
          done
          test ! -f deployment/backend/.env || (echo "❌ A full .env is present in the package — secrets must come from SSM (SA-25)" && exit 1)
          
          # Validate all required category helper functions are present
          echo "  Checking for required functions in categoryHelpers.js..."
          grep -q "createCategoryLookup" deployment/shared/utils/categoryHelpers.js || (echo "❌ createCategoryLookup function missing" && exit 1)
          grep -q "isBudgetableCategory" deployment/shared/utils/categoryHelpers.js || (echo "❌ isBudgetableCategory function missing" && exit 1)
          grep -q "getBudgetType" deployment/shared/utils/categoryHelpers.js || (echo "❌ getBudgetType function missing" && exit 1)
          grep -q "isIncomeCategoryHierarchical" deployment/shared/utils/categoryHelpers.js || (echo "❌ isIncomeCategoryHierarchical function missing" && exit 1)
          grep -q "isExpenseCategoryHierarchical" deployment/shared/utils/categoryHelpers.js || (echo "❌ isExpenseCategoryHierarchical function missing" && exit 1)
          
          echo "✅ Deployment package validation passed"
          
          # Create tarball
          tar -czf deployment.tar.gz deployment/
          
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PRODUCTION_AWS_REGION }}
          
      - name: Verify the instance can actually read the secrets
        run: |
          set -euo pipefail
          SSM_PATH="/budget-app/prod"
          INSTANCE="${{ vars.PRODUCTION_EC2_INSTANCE_ID }}"

          # Pre-flight: the host renders .env from these at deploy time, so an
          # unreadable parameter would abort the deploy mid-flight. Checking here
          # — before the package is uploaded and before the deploy send-command
          # runs — means a first-time or mis-synced setup fails with the running
          # app completely untouched.
          #
          # This MUST run as the instance role, on the instance, using the same
          # API the deploy script uses. The previous version called
          # ssm:DescribeParameters as the GitHub Actions user from the runner —
          # a different principal, a different action, in a different place. It
          # passed cleanly on all four of the first SSM-rendered deploys, each of
          # which failed for a cause it structurally could not see: no region
          # resolvable on the host, GetParametersByPath denied on the path node,
          # IAM not yet propagated, and jq missing from the host. Probing the
          # real path catches that whole class in one call.
          #
          # Names only, never --query on values: proving readability must not
          # pull plaintext secrets into a CI job log.
          REQUIRED="JWT_SECRET PLAID_CLIENT_ID PLAID_SECRET PLAID_ENCRYPTION_SECRET ANTHROPIC_API_KEY GITHUB_ISSUES_PAT VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT"

          PROBE="aws ssm get-parameters-by-path --path $SSM_PATH --recursive --with-decryption --region ${{ vars.PRODUCTION_AWS_REGION }} --query 'Parameters[].Name' --output text"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"$PROBE\"]" \
            --query "Command.CommandId" --output text)

          # `wait` returns non-zero for a failed invocation; we want to read the
          # error and report it rather than die with an opaque exit code.
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
            --query "Status" --output text)
          STDOUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
            --query "StandardOutputContent" --output text)
          STDERR=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" \
            --query "StandardErrorContent" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "❌ The instance could not read $SSM_PATH (probe status: $STATUS)"
            echo ""
            echo "$STDERR"
            echo ""
            echo "This is the AWS error from the instance itself — read it, do not guess."
            echo "See docs/AI-DEPLOYMENTS.md → 'First-time setup / disaster recovery'."
            echo "Nothing has been uploaded or deployed; production is untouched."
            exit 1
          fi

          MISSING=""
          for NAME in $REQUIRED; do
            echo "$STDOUT" | tr '\t' '\n' | tr -d '\r' | grep -qx "$SSM_PATH/$NAME" || MISSING="$MISSING $NAME"
          done

          if [ -n "$MISSING" ]; then
            echo "❌ Readable from the instance, but missing:$MISSING"
            echo ""
            echo "Run the 'Sync Secrets to SSM Parameter Store' workflow, then re-run this deploy."
            echo "Nothing has been uploaded or deployed; production is untouched."
            exit 1
          fi

          echo "✅ Instance role read all $(echo $REQUIRED | wc -w) required secrets from $SSM_PATH (decrypted, names only)"

      - name: Upload to S3
        id: upload
        run: |
          VERSION="${{ steps.deploy_version.outputs.version }}"
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          S3_PATH="s3://${{ vars.PRODUCTION_S3_BACKUP_BUCKET }}/deployments/v${VERSION}-${TIMESTAMP}.tar.gz"
          
          aws s3 cp deployment.tar.gz "$S3_PATH"
          echo "s3_path=$S3_PATH" >> $GITHUB_OUTPUT
          echo "📦 Package uploaded to: $S3_PATH"
          
      - name: Deploy via SSM
        run: |
          echo "🚀 Triggering deployment on EC2..."

          # Upload the correct deployment script and execute it
          SCRIPT_CONTENT=$(base64 -w 0 scripts/deploy-server.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.PRODUCTION_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_CONTENT' | base64 -d > /tmp/deploy-server.sh && chmod +x /tmp/deploy-server.sh && sudo -u appuser /tmp/deploy-server.sh ${{ steps.upload.outputs.s3_path }}\"]" \
            --output text \
            --query "Command.CommandId")
          
          echo "Command ID: $COMMAND_ID"
          
          # Wait for completion
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.PRODUCTION_EC2_INSTANCE_ID }}" || true
          
          # Get status
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.PRODUCTION_EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)
          
          echo "Status: $STATUS"
          
          # Show output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.PRODUCTION_EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text
          
          if [ "$STATUS" != "Success" ]; then
            echo "=== Error Output ==="
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.PRODUCTION_EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" \
              --output text
            exit 1
          fi
          
      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # Quick health check
          for i in {1..5}; do
            if curl -s https://budget.jaredcarrano.com/health | grep -q "ok"; then
              echo "✅ Deployment verified!"
              DEPLOYED_VERSION=$(curl -s https://budget.jaredcarrano.com/health | jq -r .version)
              echo "📌 Deployed version: v$DEPLOYED_VERSION"
              exit 0
            fi
            echo "Retry $i/5..."
            sleep 3
          done
          
          echo "❌ Health check failed"
          exit 1
          
      - name: Summary
        if: success()
        run: |
          VERSION="${{ steps.deploy_version.outputs.version }}"
          RELEASE_CREATED="${{ needs.release.outputs.release_created }}"
          
          echo "### 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** v$VERSION" >> $GITHUB_STEP_SUMMARY
          if [ "$RELEASE_CREATED" = "true" ]; then
            echo "- **Release:** ✅ New release created" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release:** ℹ️ No new release (no changes or skipped)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Message:** ${{ github.event.inputs.deployment_message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://budget.jaredcarrano.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v$VERSION) | [View Changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)" >> $GITHUB_STEP_SUMMARY