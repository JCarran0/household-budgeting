name: Sync Secrets to SSM Parameter Store

# SA-25 — secrets live in SSM Parameter Store, not in deployment tarballs.
#
# This workflow is the ONLY writer of /budget-app/prod/* parameters. It reads
# GitHub Secrets and writes them straight to SSM as SecureStrings, so the values
# never leave the ephemeral runner: they are not printed, not written to disk,
# and not baked into any artifact.
#
# Run this:
#   - once, before the first deploy that reads secrets from SSM
#   - again any time you rotate a secret in GitHub
#
# It is idempotent — re-running overwrites each parameter with the current
# GitHub Secret value, so it doubles as "push my rotated secret to prod".
#
# ⚠️  PLAID_ENCRYPTION_SECRET is NOT rotatable. Every stored Plaid access token
#     is derived from it; changing it orphans every linked institution and
#     requires re-linking each bank by hand. Re-running this workflow with the
#     SAME value is safe. Changing the value in GitHub first is not. See TD-025.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "SYNC" to confirm writing secrets to SSM'
        required: true
        type: string

concurrency:
  group: ssm-secret-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.inputs.confirmation == 'SYNC'
    runs-on: ubuntu-latest
    name: Write GitHub Secrets to SSM
    environment:
      name: production

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "SYNC" ]; then
            echo "❌ Confirmation text does not match. Aborting."
            exit 1
          fi
          echo "✅ Confirmation validated."

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.PRODUCTION_AWS_REGION }}

      - name: Write parameters
        env:
          # Mapped into the environment so the values are never expanded into an
          # argv the runner would log. GitHub masks secrets in logs regardless,
          # but this keeps them out of the process table too.
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          PLAID_CLIENT_ID: ${{ secrets.PRODUCTION_PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PRODUCTION_PLAID_SECRET }}
          PLAID_ENCRYPTION_SECRET: ${{ secrets.PLAID_ENCRYPTION_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.PRODUCTION_ANTHROPIC_API_KEY }}
          GITHUB_ISSUES_PAT: ${{ secrets.PRODUCTION_GITHUB_ISSUES_PAT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          set -euo pipefail
          SSM_PATH="/budget-app/prod"

          # Every secret the backend needs at runtime. Non-secret configuration
          # (PORT, LOG_LEVEL, FRONTEND_URL, …) deliberately stays in GitHub
          # Variables and is rendered into the deployment package in the clear —
          # it is not sensitive, and keeping it there means changing it does not
          # require an SSM write.
          #
          # ENCRYPTION_KEY is intentionally absent: it was a vestigial variable
          # no code ever read (SA-30). Do not add it back.
          SECRETS="
            JWT_SECRET
            PLAID_CLIENT_ID
            PLAID_SECRET
            PLAID_ENCRYPTION_SECRET
            ANTHROPIC_API_KEY
            GITHUB_ISSUES_PAT
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            VAPID_SUBJECT
          "

          MISSING=""
          WRITTEN=0

          for NAME in $SECRETS; do
            VALUE="${!NAME:-}"
            if [ -z "$VALUE" ]; then
              # An empty GitHub Secret would otherwise silently write an empty
              # parameter and the app would fail at boot with a confusing error.
              MISSING="$MISSING $NAME"
              continue
            fi

            aws ssm put-parameter \
              --name "$SSM_PATH/$NAME" \
              --value "$VALUE" \
              --type SecureString \
              --overwrite \
              --no-cli-pager > /dev/null

            echo "  ✓ $SSM_PATH/$NAME"
            WRITTEN=$((WRITTEN + 1))
          done

          if [ -n "$MISSING" ]; then
            echo ""
            echo "❌ These GitHub Secrets are unset or empty:$MISSING"
            echo "   Set them in repo settings, then re-run this workflow."
            exit 1
          fi

          echo ""
          echo "✅ Wrote $WRITTEN SecureString parameters under $SSM_PATH"

      - name: Verify (names only — never decrypts)
        run: |
          set -euo pipefail
          echo "Parameters now present under /budget-app/prod:"
          # describe-parameters returns metadata only. Deliberately NOT
          # get-parameters-by-path --with-decryption: this job has no reason to
          # pull plaintext back, and doing so would put it in the job log's
          # blast radius for no benefit.
          aws ssm describe-parameters \
            --parameter-filters "Key=Path,Option=Recursive,Values=/budget-app/prod" \
            --query "Parameters[].[Name,Type,LastModifiedDate]" \
            --output table

      - name: Summary
        if: success()
        run: |
          {
            echo "### 🔐 Secrets synced to SSM"
            echo ""
            echo "- **Path:** \`/budget-app/prod/*\` (SecureString)"
            echo "- **Synced by:** @${{ github.actor }}"
            echo "- **Time:** $(date -u +%Y-%m-%d' '%H:%M:%S' UTC')"
            echo ""
            echo "The next production deploy will render \`.env\` on the host from these values."
            echo "Deployment tarballs no longer contain any secret."
          } >> $GITHUB_STEP_SUMMARY
