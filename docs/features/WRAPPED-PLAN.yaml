# =============================================================================
# PHASE 6 — Observability + rollout
# =============================================================================
phase_6_rollout:
  status: not_started
  description: |
    Ship behind the per-user flag (dark for both users at deploy time),
    dogfood path for ~1–2 weeks, then enable spouse.

  tasks:
    - id: "6.1"
      task: Structured logs — minimal, per BRD §9.3
      details: |
        Log on:
          - Push fired: `wrapped.push.fired` — `{ userId, cadence, tier, highlightCount, delivered }`.
          - Wrapped opened: `wrapped.opened` — `{ userId, cadence, source: 'push' | 'in-app' }`.
          - Window expired without open: `wrapped.window_expired_unopened`
            — `{ userId, cadence, dateKey }`. (Detect by comparing
            dispatch log to open events at the next scheduler tick
            after midnight.)
        No dashboards; log to stdout with structured JSON. Tail on the
        server when needed.

    - id: "6.2"
      task: Deploy + dogfood
      details: |
        - Deploy with both users `wrappedEnabled: false`. Verify feature
          is invisible (routes 404, no banner, no nav item).
        - Enable author via admin panel on deploy evening.
        - Author receives 9 PM push same night. Dogfood for 1–2 weeks.
        - Tune copy pools + rule thresholds via PR as needed; no code
          change required to adjust text. Weekly archive remains
          immutable per D6 — old records untouched.
        - Launch: admin enables spouse during dinner; spouse's first push
          lands at 9 PM that night.

    - id: "6.3"
      task: Release notes + CLAUDE.md
      details: |
        - Conventional commit `feat(wrapped): ...` — triggers MINOR bump.
        - Add entry to the "Architecture Decisions (recent)" table in
          CLAUDE.md:
            `| 2026-04 | Wrapped — ... | WRAPPED-BRD.md |`
          (Already added to the Feature BRDs & Plans table; update the
          decision table in the same PR.)

# =============================================================================
# TEST PLAN SUMMARY
# =============================================================================
test_plan:
  automated:
    - layer: shared (Jest, unit)
      focus: |
        wrappedDays (DST, cross-TZ), wrappedCopy (pool counts, picker
        exhaustion fallback), wrappedRules (per-rule trigger/no-trigger
        fixtures), wrappedEngine (golden payload fixtures for tier 0, 3, 4;
        weekly with each weekly-only rule firing).

    - layer: backend service (Jest, integration)
      focus: |
        wrappedService vacation suppression, idempotency, feature-flag
        gate, admin gate, weekly snapshot immutability, repetition
        avoidance across 7 consecutive fires.

    - layer: backend routes (Jest, integration)
      focus: |
        Auth gates (401/403), family scoping, 204 out-of-window, admin
        toggle, timezone PATCH validation.

    - layer: scheduler (Jest, unit with fake timers)
      focus: |
        Per-TZ fire windows, Sunday → weekly, catch-up on boot,
        per-user error isolation.

  manual:
    - |
      Push delivery end-to-end: enable self, wait for 9 PM, verify push
      arrives on both iOS Safari (PWA installed) and desktop Chrome.
      Tap push, confirm deep link lands on `/wrapped/today`.

    - |
      Vacation suppression: add an active trip covering today, verify no
      push + banner hidden + in-app placeholder shows "On the road 🌍".

    - |
      Weekly swipe UX: on mobile Safari, swipe through all 6 cards;
      confirm URL updates; confirm screenshot capture on each card
      produces a clean image (no banners, no toasts).

    - |
      Dogfood repetition check: after 7 tier-3 days of dogfood, scan
      your own Wrappeds — same headline copy twice is a bug.

    - |
      Archive immutability: ship a PR that edits a copy pool; confirm
      a 2-week-old Wrapped renders the original text, unchanged.

# =============================================================================
# OPEN QUESTIONS (carried forward from BRD §14 — decision defaults accepted
# into the plan are noted above; anything still undecided lives here)
# =============================================================================
open_questions:
  - id: OQ1
    source: BRD §14 Q2
    question: Tier-4 threshold scales with household size or fixed at 10?
    resolution: |
      Fixed at 10 for v1 (accepted). Revisit if the app ever supports
      > 2 users.

  - id: OQ2
    source: BRD §14 Q3
    question: Extend Zombie rule to OR on snooze count once the Task model
      tracks snooze history?
    resolution: |
      Deferred until a snooze counter lands on Task (BRD §11.3 REQ-W-031
      captures this as P2). Plan: extend `zombieRule` in
      `shared/utils/wrappedRules.ts` to `OR snoozeCount ≥ 3` in a future
      PR once Task gains the field.

  - id: OQ3
    source: new
    question: Should the weekly archive eventually support filtering
      (e.g., "weeks with midweek comeback") as it grows?
    resolution: |
      Not v1. The archive at 52 rows/year is small enough to scroll.
      Revisit at year-end 2026 if the author actually wants to browse
      by theme.

  - id: OQ4
    source: new
    question: Multi-instance PM2 deploy — scheduler leader-election?
    resolution: |
      Not relevant today (single-instance per AI-DEPLOYMENTS.md). If
      the backend ever scales horizontally, add a filesystem-advisory-
      lock or a DB-backed lease on `wrapped_scheduler_lock` before
      firing. Out of scope for v1.
