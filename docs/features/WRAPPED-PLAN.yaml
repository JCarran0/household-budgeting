overview:
  description: |
    Daily + weekly family recap, pushed at 9 PM local on a per-user schedule.
    Additive, presentation-only — no new write surface touches existing data
    beyond two fields on `User` and one new persisted entity (`WeeklyWrapped`).

    The feature is composed of six concerns, each owning a file or folder:

    1. **Rule engine** — a pure, stateless module in `shared/utils/wrapped*.ts`
       that takes a day's (or week's) worth of family data and returns
       `{ headline, motivationalCopyId, highlights }`. Same entry point for
       daily and weekly; cadence flag toggles which rules evaluate.

    2. **Copy pools** — data-only file `shared/utils/wrappedCopy.ts`; tier
       pools, highlight variants, voice rules in comments. Edited by PR.

    3. **Nightly scheduler** — `backend/src/jobs/wrappedScheduler.ts`, a
       15-minute tick started from `backend/src/index.ts`. Per user with
       `wrappedEnabled === true`, checks whether local time is in
       [9:00, 9:15] PM, then fires. Idempotent on
       `(userId, cadence, localDateKey)` via a small per-user dispatch log.

    4. **Persistence** — `WeeklyWrapped` records stored per family at
       `weekly_wrappeds_${familyId}.json` (matches existing naming). No daily
       persistence beyond the dispatch log.

    5. **Push delivery** — reuses the existing `pushNotificationService`
       (VAPID/web-push). Adds a new `NotificationType: 'wrapped'` and a
       thin `sendWrappedPush` helper that composes the payload.

    6. **Frontend surfaces** — `/wrapped/today`, `/wrapped/week`,
       `/wrapped/archive` routes; a dashboard banner slot during the
       viewing window; a nav item with unopened-dot indicator. Daily is
       a single card; weekly is a 6-card swipe deck.

    No new Plaid calls. No new LLM calls in v1 (AI copy is an explicit
    P2/v2 item). The compute load is trivial: one rule-engine evaluation
    per enabled user per day.

  key_files:
    brd: docs/features/WRAPPED-BRD.md

    # Shared types + pure compute (deterministic, unit-testable)
    shared_types: shared/types/index.ts
    shared_wrapped_engine: shared/utils/wrappedEngine.ts            # new — rule engine, headline/highlight selection
    shared_wrapped_rules: shared/utils/wrappedRules.ts              # new — 11 rule definitions, candidate producers
    shared_wrapped_copy: shared/utils/wrappedCopy.ts                # new — tier pools + highlight variant pools
    shared_wrapped_days: shared/utils/wrappedDays.ts                # new — IANA-aware window + week boundary helpers (leverage easternTime.ts style)

    # Backend — service, routes, scheduler, storage
    backend_service: backend/src/services/wrappedService.ts         # new — compose, persist, read
    backend_scheduler: backend/src/jobs/wrappedScheduler.ts         # new — 15-min tick
    backend_routes: backend/src/routes/wrapped.ts                   # new — GET today/week/archive, admin toggle
    backend_index: backend/src/index.ts                             # modify — wire scheduler + routes
    backend_services_index: backend/src/services/index.ts           # modify — export wrappedService
    backend_push_service: backend/src/services/pushNotificationService.ts  # modify — extend NotificationType + sendWrapped helper
    backend_data_service: backend/src/services/dataService.ts       # modify — get/save WeeklyWrapped[]

    # Frontend
    frontend_routes: frontend/src/App.tsx
    frontend_api: frontend/src/lib/api/wrapped.ts                   # new
    frontend_today_page: frontend/src/pages/WrappedToday.tsx        # new — daily single card
    frontend_week_page: frontend/src/pages/WrappedWeek.tsx          # new — 6-card deck
    frontend_archive_page: frontend/src/pages/WrappedArchive.tsx    # new
    frontend_banner: frontend/src/components/dashboard/WrappedBanner.tsx  # new — dashboard entry
    frontend_dashboard: frontend/src/pages/MantineDashboard.tsx     # modify — slot the banner
    frontend_layout: frontend/src/components/MantineLayout.tsx      # modify — nav item + dot
    frontend_admin_settings: frontend/src/components/settings/WrappedAdminSection.tsx  # new — per-user toggle panel
    frontend_notifications_section: frontend/src/components/settings/NotificationsSection.tsx  # modify — add "Wrapped" row

    # Tests
    backend_tests_engine: backend/src/__tests__/unit/wrappedEngine.test.ts
    backend_tests_rules: backend/src/__tests__/unit/wrappedRules.test.ts
    backend_tests_scheduler: backend/src/__tests__/unit/wrappedScheduler.test.ts
    backend_tests_service: backend/src/__tests__/integration/wrappedService.test.ts
    backend_tests_routes: backend/src/__tests__/integration/wrappedRoutes.test.ts

# =============================================================================
# DECISIONS LOG — Capture key shape + pattern choices before code lands
# =============================================================================
decisions:
  - id: D1
    date: 2026-04-24
    decision: Rule engine is pure shared TypeScript; backend calls it; no LLM in v1
    rationale: |
      BRD §6.4 + §11.3 REQ-W-027 make the v1 copy path explicitly templated.
      A pure function (`computeWrapped(input): WrappedPayload`) is
      deterministic, unit-testable with a handful of golden fixtures, and
      cheap to run on the server. Placing it in `shared/` also means
      the frontend can preview it in a dev-only tool if needed, without
      a round trip.

  - id: D2
    date: 2026-04-24
    decision: Two new User fields — `wrappedEnabled: boolean` and `timezone: string` (IANA)
    rationale: |
      `wrappedEnabled` is required by §9.1. `timezone` is required by §2.2
      and §7.1 — the scheduler must know each user's local time to fire at
      9 PM local. Absent today. Default `timezone` to the household/app
      default (`America/New_York`) for existing users at migration time;
      expose an editable control in settings. Adding two optional-with-
      defaulted fields is backwards-compatible with the JSON storage model
      — the data service reads with defaults.

  - id: D3
    date: 2026-04-24
    decision: Reuse the shipped `isAdmin` flag (post-TD-006) for the Wrapped admin panel; do NOT use email match
    rationale: |
      BRD §9.1 suggested "hardcoded to user.email === env.ADMIN_EMAIL" as an
      interim. The admin-role system (commit 736dfa9, `adminMiddleware`)
      already ships a real `User.isAdmin` + env-bootstrapped
      `ADMIN_USERNAMES`. Using the shipped gate is strictly better than an
      email-match hack — same surface, one less bespoke check to maintain.
      The "admin-only toggle per household member" panel goes behind
      `adminMiddleware`. Mirrors the current admin routes pattern at
      `backend/src/routes/admin.ts`.

  - id: D4
    date: 2026-04-24
    decision: One new NotificationType (`'wrapped'`); one new NotificationPreferences key (`wrappedEnabled`)
    rationale: |
      `wrappedEnabled` in BRD §9 conceptually belongs on the User for the
      feature-flag semantics (visibility gate), but the push subscription
      plumbing already has a `NotificationPreferences` object and a
      per-user preferences file. Split cleanly:
        - `User.wrappedEnabled`      — gate on ALL surfaces (routes, banner,
                                       nav, push); default `false`; admin-
                                       only toggle in settings.
        - `NotificationPreferences.wrappedEnabled` — push opt-in; default
                                       `true` (the user-level gate already
                                       hides the feature; once visible, push
                                       should be on by default). User can
                                       toggle push off without turning the
                                       in-app feature off.
      The User-level gate is the primary; the preferences toggle is a
      standard "unsubscribe from this push type" affordance.

  - id: D5
    date: 2026-04-24
    decision: Daily Wrapped is NOT persisted — only a dispatch log row
    rationale: |
      BRD §8.1 + REQ-W-002 explicit. The Wrapped is computed on-demand when
      the viewer hits `/wrapped/today` during the window, from the current
      task / trip / project / transaction data. A server-side re-compute
      during the viewing window is deterministic (same inputs → same output,
      modulo the copy-pool pick — which reads from a 7-day cache we DO
      persist). Only persisted: a minimal dispatch log row per push fired
      — `(userId, cadence, localDateKey, firedAt)` — for idempotency.
      Location: `wrapped_dispatch_${userId}.json`, capped at 60 rows
      (FIFO trim).

  - id: D6
    date: 2026-04-24
    decision: WeeklyWrapped snapshotted at generation time, immutable thereafter
    rationale: |
      BRD §8.3 explicit. Mirrors the TASK-LEADERBOARD v2.0 per-badge
      `shippedAt` + `celebrationCopy` pattern. Once the Sunday 9 PM job
      fires for a household, the record is frozen: copy pool edits, rule
      threshold changes, even bug fixes do not retroactively mutate the
      archive. The `cards` field stores fully-rendered content (resolved
      copy variant ID + slot fills), not raw inputs.

  - id: D7
    date: 2026-04-24
    decision: Scheduler is a 15-minute setInterval loop started in `backend/src/index.ts`; no new dependency
    rationale: |
      BRD §10 + §14 Q1 + Q9 accept 15-minute cadence. The app does not
      currently use node-cron or any job framework — the sole precedent is
      the chat-action-cards `setInterval` sweep in
      `backend/src/services/chatActions/proposalStore.ts:116`. Follow that
      pattern: module-level `setInterval` wrapped in try/catch, `.unref()`
      so it doesn't block process exit, graceful shutdown on SIGTERM.
      Adds zero new dependencies. If PM2 ever shifts to multi-instance
      mode, this needs a leader-election or cron-node guard — out of scope
      for a single-instance deploy (noted in §12 Assumptions).

  - id: D8
    date: 2026-04-24
    decision: Family data aggregation reuses the leaderboard's per-user `CreditEvent` stream
    rationale: |
      The leaderboard already computes per-user credit events from tasks.
      `CreditEvent` is defined in `shared/utils/leaderboardStreaks.ts`. The
      Wrapped rule engine needs the same day-by-day counts plus:
        - Streak state (current/best) — already computed in
          `shared/utils/leaderboardStreaks.ts`.
        - New badge earns in the window — already computed in
          `shared/utils/leaderboardBadges.ts` (filter by `earnedAt`).
        - Zombie closes (age ≥7 days) — new derivation, pure from Task list.
        - Project/Trip/Receipt deltas — new derivations.
      The rule engine accepts a `WrappedInput` that is composed by
      `wrappedService.buildInput(familyId, window)`, which does the data
      assembly. Engine stays pure; service does I/O.

  - id: D9
    date: 2026-04-24
    decision: Repetition avoidance uses a per-household rolling-7-day `usedCopyIds` cache persisted alongside WeeklyWrapped
    rationale: |
      BRD §6.4. Key: `wrapped_recent_copy_${familyId}.json` — a small
      array of `{ copyId, usedAt }` records, pruned to last 7 days on
      read. Filter logic in `wrappedCopy.pickVariant(poolId, recentIds)`
      returns a random eligible variant or falls back to "any" when the
      pool is exhausted. Family-level (not per-user) — both spouses see
      the same family Wrapped so the cache is rightfully family-scoped.

  - id: D10
    date: 2026-04-24
    decision: Vacation suppression checks `activeTripCoversDate` at generation time, not ahead of time
    rationale: |
      BRD §2.3. A trip being added at 8:58 PM should suppress the 9 PM push.
      The scheduler checks `tripHelpers.getActiveTrip(familyId, today)`
      right before firing. Cheap — trips are already in-memory if the
      wrappedService shares a dataService instance. For weekly records
      that span a trip-containing week, the record IS still written (with
      `suppressed: true`) so the archive has the entry, but no push fires
      and the in-app banner shows the muted placeholder.

  - id: D11
    date: 2026-04-24
    decision: Weekly "Best Day" and "Leaderboard" cards use cumulative counts from CreditEvent stream; ties tie-break deterministically
    rationale: |
      Best Day: `max(dayCounts)`, ties → most recent day of week
      (Sunday being "most recent" in the Mon–Sun week). Leaderboard:
      per-user sum; tie → `winnerId: null` and the tied-week copy pool
      (BRD §14 Q4 proposed; accept). Determinism is important: the
      WeeklyWrapped is snapshotted once, but a user opening the archive
      should see a stable value even if a hypothetical re-computation
      ran on identical data.

  - id: D12
    date: 2026-04-24
    decision: Tier-0 push body elides the zero count (BRD §14 Q7 proposed; accept)
    rationale: |
      Push body for tier-0: `"Your Wrapped is ready 🌙"`. Push body for
      tier 1+: `"You two closed {N} today. {H} highlight(s) inside."` where
      `{H}` is the highlight count (0–2). The gentle framing lives inside
      the app; the push surface avoids broadcasting a zero count to the
      lock screen.

  - id: D13
    date: 2026-04-24
    decision: Leaderboard-win rule uses the family-scope CreditEvent stream (same as the shipped leaderboard)
    rationale: |
      BRD §5.1 rule 5 + REQ-W-019 + BRD §1.3 family-scope filter. The
      existing leaderboard already filters by `scope === 'family'` per
      TASK-MANAGEMENT-BRD v2.0. Wrapped's rule engine consumes the same
      filtered events — personal tasks never contribute. No separate
      scope-filter code lives in the Wrapped engine.

  - id: D14
    date: 2026-04-24
    decision: Daily Wrapped stream is served via a single endpoint `GET /api/v1/wrapped/today`; client polls on open
    rationale: |
      The endpoint returns the full rendered payload (or 204 if out-of-
      window / suppressed / disabled). No real-time subscription needed —
      opening the Wrapped is a read. The response is cacheable for the
      life of the window by a `Cache-Control: private, max-age=300` header;
      the client invalidates on window-edge and on push receipt.

  - id: D15
    date: 2026-04-24
    decision: Frontend uses the same `useSearchParams` URL-state pattern CLAUDE.md calls out for chatbot/BvA
    rationale: |
      Weekly card index goes in `?card=0..5` so deep links and "share this
      card" screenshots reference a stable URL. Archive detail route is
      `/wrapped/archive/:weekStart?card=0`. Consistent with the
      2026-04 architecture decision on URL-based page state.

