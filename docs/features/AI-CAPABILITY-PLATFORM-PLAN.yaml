# =============================================================================
# AI Capability Platform — Implementation Plan
# =============================================================================
# BRD: docs/features/AI-CAPABILITY-PLATFORM-BRD.md
# Status: Phases 0-2 complete; Phase 3 largely delivered; Phase 4 backend
#         delivered, activity-log UI outstanding
# Last Updated: 2026-09-13
# =============================================================================

overview:
  description: |
    How the capability platform described in the BRD is being built, and what
    has landed so far.

    The BRD states the governing model: the LLM is a planner, never an
    executor; every capability declares a trust tier in the registry; a human
    sees every field a write will change before it happens. This plan records
    the mechanism chosen for each of those requirements, the order the work
    ships in, and the implementation-level decisions that are not obvious from
    the requirement text.

    Phases 0 (correctness), 1 (foundations) and 2 (read coverage) are complete.
    Phase 3 has delivered its task and transaction-metadata write actions along
    with the SEC-P030 machinery they needed; trip/project and financial writes
    remain. Phase 4's backend — undo handles, the activity store, the undo
    service and its routes — is delivered; the user-facing activity log UI is
    not.
    Phase 1 also absorbed the whole of Agent Learnings Phase 1 — see
    AI-AGENT-LEARNINGS-PLAN.yaml.

  key_files:
    brd: docs/features/AI-CAPABILITY-PLATFORM-BRD.md
    learnings_brd: docs/features/AI-AGENT-LEARNINGS-BRD.md
    learnings_plan: docs/features/AI-AGENT-LEARNINGS-PLAN.yaml
    shared_types: shared/types/index.ts
    action_registry: backend/src/services/chatActions/registry.ts
    tiers: backend/src/services/chatActions/tiers.ts
    proposal_store: backend/src/services/chatActions/proposalStore.ts
    proposal_rows: backend/src/services/chatActions/proposalRows.ts
    execution_grant: backend/src/services/chatActions/executionGrant.ts
    audit_log: backend/src/services/chatActions/auditLog.ts
    read_capabilities: backend/src/services/capabilities/readCapabilities.ts
    platform_tools: backend/src/services/capabilities/platformTools.ts
    tool_intercepts: backend/src/services/capabilities/toolIntercepts.ts
    chatbot_service: backend/src/services/chatbotService.ts
    cost_tracker: backend/src/services/chatbotCostTracker.ts
    trace_store: backend/src/services/agentTraceStore.ts
    chatbot_routes: backend/src/routes/chatbot.ts
    action_card: frontend/src/components/chat/ActionCard.tsx
    action_card_row: frontend/src/components/chat/ActionCardRow.tsx
    budgeting_capabilities: backend/src/services/capabilities/budgetingCapabilities.ts
    planning_capabilities: backend/src/services/capabilities/planningCapabilities.ts
    task_reader: backend/src/services/chatbotReaders/taskReader.ts
    trip_reader: backend/src/services/chatbotReaders/tripReader.ts
    project_reader: backend/src/services/chatbotReaders/projectReader.ts
    family_member_reader: backend/src/services/chatbotReaders/familyMemberReader.ts
    message_bubble: frontend/src/components/chat/ChatMessageBubble.tsx
    undo_snapshot: backend/src/services/chatActions/undoSnapshot.ts
    activity_store: backend/src/services/actionActivityStore.ts
    undo_service: backend/src/services/actionUndoService.ts
    activity_routes: backend/src/routes/aiActivity.ts
    workspace_guard: backend/src/middleware/refuseBusinessWorkspace.ts
    update_task_action: backend/src/services/chatActions/updateTaskAction.ts
    complete_task_action: backend/src/services/chatActions/completeTaskAction.ts
    transaction_actions: backend/src/services/chatActions/transactionMetadataActions.ts

  pre_existing_foundation: |
    The platform was not greenfield. What already worked before Phase 0, and
    what it cost to keep working:

      - services/chatbotDataService.ts — ReadOnlyDataService injected;
        structurally cannot write (SEC-018). Unchanged.
      - services/chatActions/registry.ts — Map-based allowlist
        (prototype-pollution safe), Zod schema per action, JWT-derived context.
        Extended with tier / dataClass / describeCurrent.
      - services/chatActions/proposalStore.ts — single-use expiring nonces.
        Mechanism solid; storage is in-memory (TD-030, REQ-P028).
      - services/chatActions/auditLog.ts — structured success/rejection logging
        to CloudWatch. Not yet surfaced in UI (Phase 4).
      - createTaskAction.ts, submitGithubIssueAction.ts — the two registered
        actions. create_task re-uses createTaskSchema from routes/tasks.ts.
      - chatbotCostTracker.ts — mutex-guarded monthly cap, segmented per
        workspace. Extended with workload classes and cache pricing.
      - frontend ChatMessageBubble.tsx — react-markdown + remark-gfm behind a
        narrowed rehype-sanitize allowlist (TD-015). `img` was already absent,
        which is why SEC-P023 needed locking rather than building.

decisions:
  - id: D1
    date: 2026-09-13
    decision: |
      Tool definitions are built lazily and memoized (chatbotService.chatbotTools()),
      not as a module-level const.
    rationale: |
      The original CACHED_CHATBOT_TOOLS const evaluated during the chat-action
      registration import cycle
      (chatActions/index -> createTaskAction -> routes/tasks -> services/index ->
      chatbotService -> readCapabilities -> chatActions/index), so the registry
      was empty at evaluation time and the tool enum came out blank. Lazy
      memoization defers the read until after registration while keeping the
      cached prefix byte-identical across requests (REQ-P017).

  - id: D2
    date: 2026-09-13
    decision: |
      readCapabilities.ts imports listChatActionIds from ../chatActions/registry
      directly, never from the chatActions barrel; the startup assertion
      buildChatbotTools() lives in app.ts, not services/index.ts.
    rationale: |
      Same cycle as D1. Importing the barrel re-enters it; asserting from
      services/index.ts runs mid-cycle and fails for a reason that has nothing
      to do with the assertion. app.ts is the first module outside the cycle.

  - id: D3
    date: 2026-09-13
    decision: |
      SEC-P010 is enforced as display *coverage*: buildProposalRows rejects any
      row whose server-parsed params contain a key with no matching
      displayField.
    rationale: |
      An adversarial review found the shape check was not the control. The
      dangerous proposal is a well-formed row showing a plausible title while
      params.body carries 64 KB the user never sees — a one-click exfiltration
      primitive for submit_github_issue, which POSTs with a server-held token,
      and authorable by injected text in an uploaded receipt. Coverage closes
      it; presence does not.

  - id: D4
    date: 2026-09-13
    decision: |
      Execution grants are branded values only proposalStore mints, one per
      row, keyed by rowId; a source scan test fails if anything else mints one
      or calls a handler directly.
    rationale: |
      JS has no module-private constructor, so the brand alone is convention.
      The call-site scan is what turns "greppable" into "enforced" (REQ-P002).
      Mutation-verified: adding a mintConfirmationGrant(...) call and a bare
      DEF.execute(...) call both fail the test.

  - id: D5
    date: 2026-09-13
    decision: |
      The interactive cost cap keeps its original storage key
      (chatbot_costs_{familyId}_{month}); only the background class gets a new key.
    rationale: |
      Suffixing the interactive key would have orphaned the current month's
      accrued spend and silently reset the running total — repeating the
      one-time reset D11 already paid for.

  - id: D6
    date: 2026-09-13
    decision: |
      Trace tool results above 64 KB are dropped and flagged resultTruncated
      rather than shortened.
    rationale: |
      REQ-P061 asks for verbatim results, but an uncapped ledger persists every
      transaction the model ever read. Dropping-with-a-flag keeps "this is what
      the model saw" distinguishable from "this is a fragment of it"; silent
      truncation destroys that distinction, which is the whole diagnostic value.

  - id: D7
    date: 2026-09-13
    decision: |
      Trace pinning (REQ-P063) is set at trace-write time from whether the turn
      recorded a learning. AgentTraceStore.pin() is retained only for pinning an
      older trace.
    rationale: |
      pin() shipped with unit tests and zero production callers — a feature
      reachable by nothing, so every learning older than 30 days would have lost
      its evidence. Calling pin() from inside the chat loop would also be a
      no-op, because the trace does not exist yet at that point.

  - id: D8
    date: 2026-09-13
    decision: |
      Plan-card rows group by actionId, not by label.
    rationale: |
      Labels come from the registry per action, so grouping on them is
      equivalent-but-indirect for real data and wrong for anything that varies
      label within an action. Found via a test fixture that gave 30 rows one
      actionId with alternating labels and saw them merge.

  - id: D9
    date: 2026-09-13
    decision: |
      REQ-P023 ships as all-or-nothing *validation*, not all-or-nothing
      execution. Full rollback waits for Phase 4.
    rationale: |
      Every checked row is validated before any row executes, so a batch that
      would fail validation writes nothing. A storage failure partway through
      still leaves earlier rows applied — there is no rollback to perform until
      REQ-P025 durable undo handles record prior state.

  - id: D10
    date: 2026-09-13
    decision: |
      Domain read logic lives in backend/src/services/chatbotReaders/*, composed
      into ChatbotDataService as readonly collaborators rather than added as
      methods.
    rationale: |
      Mechanically it keeps chatbotDataService.ts inside the 800-LOC budget
      ahead of the growth rather than after it. Substantively, each domain
      carries its own correctness landmine — night-based stays, non-exclusive
      tags, estimate-only line items — and those are far easier to review as a
      self-contained file with its own docblock than as three more method
      clusters in a 700-line class. The readers receive the same
      ReadOnlyDataService, so SEC-018's compile-time boundary extends unchanged.

  - id: D11
    date: 2026-09-13
    decision: |
      familyMemberReader.ts is the ONLY module AI code may use to touch the
      `families` blob, and it selects one family by id before returning
      anything. It exposes userId and displayName only.
    rationale: |
      Families are stored in a single GLOBAL blob, not a per-family key — unlike
      every other entity the AI reads. A read tool that forgot the filter would
      hand the model every household's roster in the deployment. Concentrating
      that read in one narrow module with a loud docblock is the control;
      mutation-verified against a fall-back-to-first-family bug.

  - id: D12
    date: 2026-09-13
    decision: |
      Tools that report tag-derived money carry an explicit boolean flag
      (crossTripTotalsAreNotAdditive, crossProjectTotalsAreNotAdditive,
      includesTransactionsOutsideDateRange) in the payload, AND state the same
      rule in the tool description, AND state it in the system prompt.
    rationale: |
      Belt and braces, deliberately. The flag is the contract and survives
      paraphrase; the prose is what the model actually reads first. Neither
      alone was judged sufficient for a rule whose violation produces a
      confident, plausible, wrong dollar figure — the Subaru failure mode.
      BRD §9.4 was corrected in the same change: it had described non-additive
      *line-item* actuals, a mechanism that does not exist in this app.

  - id: D13
    date: 2026-09-13
    decision: |
      SEC-P030 is a `validateSemantics` hook run as its OWN pass in the confirm
      route — after every row parses, before any row executes.
    rationale: |
      REQ-P023 requires all-or-nothing validation across a batch. A check inside
      `execute` passes its own unit test and still leaves the batch
      half-applied when row 3 turns out to name a record that does not exist.
      Mutation-verified: moving the pass into the execute loop breaks six tests,
      including "applies no row when a LATER row fails to resolve".
      Kept separate from the parse loop as well, because "is it well-formed" and
      "does it exist" are different questions and only the second needs data.

  - id: D14
    date: 2026-09-13
    decision: |
      Undo is three functions per action — capture, read, restore — not one.
    rationale: |
      Splitting capture from read lets the PLATFORM own change detection: it
      fingerprints the record after the write and again at undo time, so
      REQ-P027's skip-don't-clobber rule is implemented once. An action only
      says how to read and restore its own record, and cannot get the rule
      subtly wrong. `read` must return the same shape `capture` records, or
      every undo would look like a modified record and refuse to run.

  - id: D15
    date: 2026-09-13
    decision: |
      An action with no `undo` capability is irreversible, and the activity log
      says so explicitly rather than hiding the row or offering a dead control.
    rationale: |
      submit_github_issue is the standing case: a posted issue cannot be
      unposted. Every branch where undo is unavailable — no capability, capture
      failed, record unreadable afterwards — records its own reason at write
      time, so the user learns it from the log rather than from a click that
      does nothing.

  - id: D16
    date: 2026-09-13
    decision: |
      Undo and the activity log are NOT capabilities. No tool, no registry
      entry, no propose_action path.
    rationale: |
      Undo restores a value the user already approved changing, so it looks
      harmless. It is not: an agent-reachable undo is a write primitive outside
      the proposal mechanism. The model could not choose the value, but it
      could choose the moment, and "revert the categorisation you just
      approved" is a mutation nobody consented to.

  - id: D17
    date: 2026-09-13
    decision: |
      refuseBusinessWorkspace moved from routes/chatbot.ts into shared
      middleware.
    rationale: |
      It was local to one router, so the second AI router (activity log and
      undo) could have been written without it and nothing would have caught
      the omission. Undo is a write path, which is strictly worse than the read
      exposure the guard originally closed.

phase_0_correctness:
  status: completed
  description: |
    Close the known-wrong tool behavior that produced the Subaru incident, and
    lock the rendering invariant before building anything on top of it.
  tasks:
    - id: "0.1"
      task: Fix get_budgets — return category names, an explicit hasBudget flag, and a truthful description
      status: completed
      details: |
        Shipped in d313041. The tool returned {id, categoryId, month, amount}
        with no names (forcing a join against get_categories) and omitted
        categories with no budget entirely (making "unbudgeted" indistinguishable
        from "not looked up"). Its description also claimed it returned "budget
        amounts and actuals" when it returned none. Description in
        capabilities/readCapabilities.ts now states plainly that it does NOT
        return actual spending. Satisfies SEC-P032, SEC-P033, REQ-P019.
        Regression coverage: chatbotDataService.getBudgetsForTool.test.ts —
        also the seed eval case, REQ-L062.

    - id: "0.2"
      task: Lock the §7.3 output-rendering invariant with a test
      status: completed
      details: |
        frontend/src/components/chat/ChatMessageBubble.security.test.tsx,
        mutation-verified. Asserts the sanitizer is present, the allowlist is
        not widened, and `img` stays absent (SEC-P023, SEC-P025).

phase_1_foundations:
  status: completed
  description: |
    Tier and dataClass in the registry; tool definitions derived from it; plan
    cards with per-row toggles; split cost caps; structured trace.

    Exit criterion met: the two pre-existing actions run unchanged on the new
    machinery, proven by the pre-existing chatActions.security.test.ts suite
    passing against the rewritten confirm path.

    Phase 1 also delivered work beyond its original scope — the Business
    Workspace route guard, execution grants, the SEC-P010 coverage rule, the
    SEC-P024 link amendment, the 5-series model move, cost-accounting
    completeness, and all of Agent Learnings Phase 1.
  tasks:
    - id: "1.1"
      task: Add tier and dataClass to the capability registry with fail-fast registration
      status: completed
      details: |
        chatActions/tiers.ts holds T2_PERMITTED_DATA_CLASSES. Registration throws
        on duplicate actionId, missing tier, missing dataClass, or a T2
        declaration whose dataClass is not permitted (REQ-P001, REQ-P014,
        SEC-P003). REQ-P015's hardcoded-T2-list test asserts the set is empty
        today, so the first T2 promotion must edit it.

    - id: "1.2"
      task: Derive tool definitions from the registry
      status: completed
      details: |
        capabilities/readCapabilities.ts pairs each read tool's definition with
        its executor; buildChatbotTools() derives the array (REQ-P010). Write
        actions stay in the chat action registry and are never exposed as tools —
        they reach the model only via propose_action, whose actionId enum is
        derived from listChatActionIds by buildProposeActionTool(). Boot
        assertion in app.ts (D1, D2).

    - id: "1.3"
      task: Plan cards — 1..N rows under one proposal
      status: completed
      details: |
        shared/types: ProposalRow {rowId, actionId, label, params,
        displaySummary, displayFields, currentValues?}; ActionProposal carries
        rows[]; ActionConfirmRequest carries the selected rows; ActionRowResult
        and ActionConfirmResponse report per-row outcomes.
        Server-side row construction in chatActions/proposalRows.ts, capped at
        MAX_PROPOSAL_ROWS = 100. Row labels always come from the registry
        definition, never from model input. describeCurrent is wrapped in
        try/catch so a hook failure degrades to "no comparison" rather than
        failing the proposal.
        SEC-A007 preserved: one proposal per conversation, single-use nonce,
        15-minute TTL, atomic supersession all unchanged.

    - id: "1.4"
      task: Enforce SEC-P010 as display coverage
      status: completed
      details: |
        findUndisplayedParams in proposalRows.ts rejects any defined param with
        no matching displayField. Also rejects non-array displayFields,
        empty/whitespace values (they render as nothing), duplicate keys (one
        silently disappears), and an empty field list. See D3.
        Coverage: proposalRows.test.ts, planCards.security.test.ts.

    - id: "1.5"
      task: Execution grants and the call-site scan
      status: completed
      details: |
        proposalStore's consume result returns one ExecutionGrant per row, keyed
        by rowId. executionGrantCallSites.test.ts scans production source and
        fails if anything outside proposalStore mints a grant or calls an action
        handler directly (REQ-P002). See D4.

    - id: "1.6"
      task: Rewrite the confirm path for batches
      status: completed
      details: |
        routes/chatbot.ts: resolve selection -> rejectBatch helper -> validate
        ALL rows into a plan[] -> execute in order. Every row is re-validated by
        its own Zod schema at confirm time, as edited (REQ-P024). The audit log
        records step.grant.familyId, not the JWT's, so the logged scope is the
        one execution actually ran under. Partial-failure semantics per D9; the
        response names the failing row and the count applied, and the frontend
        surfaces that body verbatim instead of axios's "Request failed with
        status code 500". The card then withdraws Confirm and Edit, because the
        nonce is spent whether or not execution succeeded.

    - id: "1.7"
      task: Plan-card UI — per-row checkboxes, grouping, confirm count
      status: completed
      details: |
        ActionCard.tsx (~502 LOC) with ActionCardRow.tsx extracted as a
        collaborator before the budget bit. Per-row checkboxes (REQ-P021);
        countByType / groupByType keyed on actionId with per-group select-all
        past PROPOSAL_ROW_GROUPING_THRESHOLD = 25 (SEC-P012, D8); "Apply N
        changes" derived from checked rows at click time (SEC-P013).
        currentFor() pairs a proposed value with the current value it replaces,
        struck through (SEC-P011) — both shipped actions are creates and
        populate nothing, so the first real implementers are the Phase 3 update
        actions.
        Coverage: ActionCard.plan.test.tsx.

    - id: "1.8"
      task: Split cost caps by workload class
      status: completed
      details: |
        chatbotCostTracker.ts: interactive $20/mo + background $5/mo, mutex-
        guarded, per workspace x class (REQ-P050-P053). canAffordBatch
        implements the REQ-P055 pre-flight so a sweep that cannot finish never
        starts. Storage key decision in D5. Confirming a pending card performs
        no LLM call, so an exhausted cap never strands a valid card (SEC-A020).

    - id: "1.9"
      task: Structured trace, always on
      status: completed
      details: |
        agentTraceStore.ts, wired into ChatbotService. Per-family JSON at
        ai_traces_{familyId} — a narrow appender over one namespace, not a
        general write capability handed to the chatbot. Retention applied on
        each write rather than by a sweep: 30 days, hard cap of 1000 traces per
        family, pinned traces evicted last (REQ-P063). Result truncation per D6.
        Attachments recorded as MIME type and byte count only (SEC-P041).

    - id: "1.10"
      task: Business Workspace AI refusal
      status: completed
      details: |
        refuseBusinessWorkspace in routes/chatbot.ts 403s all five AI routes
        when the JWT's active family is a business workspace (REQ-P016, §11).
        The frontend also hides the chat surface and buildChatbotTools takes an
        aiEnabled flag, but the route guard is the enforcement point — a flag
        nobody passes protects nothing.
        This closed a live exposure, not just a policy gap: a business-workspace
        token could read client royalty transactions through
        get_spending_by_category.
        Coverage: businessWorkspaceAi.security.test.ts, mutation-verified.

    - id: "1.11"
      task: Amend SEC-P024 — external links clickable with host disclosure
      status: completed
      details: |
        ChatMessageBubble.tsx: hostForDisclosure(href, linkText) and
        textOf(children); the anchor renderer emits rel="noopener noreferrer
        nofollow" plus a dimmed (host) when the link text does not already
        contain the host. Locked by ChatMessageBubble.security.test.tsx —
        deleting those tests removes the basis on which the amendment was
        accepted.

    - id: "1.12"
      task: Move to the 5-series models
      status: completed
      details: |
        claude-sonnet-5 and claude-opus-5 across chatbotService,
        categorizationService, amazonCategorizerAdapter and amazonPdfParser;
        Haiku 4.5 is still current and stays pinned to its dated build
        (REQ-P056). All three verified against the Messages API, including a
        multi-turn tool loop on Opus 5 — whose responses now lead with a
        thinking block, which the loop tolerates because it selects blocks by
        type rather than by position.

    - id: "1.13"
      task: Close the two cost undercounts
      status: completed
      details: |
        Both were the "quietly too small" kind a cap cannot survive.
        (1) usage.input_tokens excludes cache reads AND writes, so the
        deliberately-cached prefix (REQ-P017) was billed by Anthropic and
        recorded here as zero — worst on the short-burst pattern this family
        actually uses, since a cache write costs 1.25x uncached input. Added
        CACHE_WRITE_5M_MULTIPLIER = 1.25, CACHE_READ_MULTIPLIER = 0.1,
        CacheTokenUsage and cacheCost(); recordUsage and estimateCost take an
        optional trailing cache argument; the loop threads
        totalCacheWriteTokens / totalCacheReadTokens.
        (2) Usage was recorded only on the success path, so a tool loop that ran
        to its 10-iteration limit or a request that timed out after several
        Claude calls moved the monthly total by $0. The catch block now records
        tokens spent before the failure.
        Rates verified 2026-09-13: Opus 5 $5/$25, Sonnet 5 $2/$10, Haiku 4.5
        $1/$5 — MODEL_PRICING updated (Sonnet had moved).
        Coverage: costTrackerCachePricing.test.ts. Postscript added to TD-012.
      note: |
        Opus 5 and Sonnet 5 use a newer tokenizer producing ~30% more tokens for
        the same text, so a $20 cap buys roughly 30% fewer Opus conversations
        than before even though the per-token price is unchanged.

    - id: "1.14"
      task: Keep chatbotService.ts under its size budget
      status: completed
      details: |
        handleProposeAction and handleRecordLearning extracted into
        services/capabilities/toolIntercepts.ts when chatbotService.ts reached
        779 of its 800-LOC budget. Types: ToolMessageResult (tool_error |
        tool_ok) and InterceptResult (ToolMessageResult | {kind: 'proposal'}).
        chatbotService.ts now ~740 LOC.

phase_2_read_coverage:
  status: completed
  description: |
    Task, trip, and project read tools. Read coverage was the larger near-term
    win: the assistant could see money and nothing else, and a planner that
    cannot see the board cannot propose good moves.

    Exit criterion met: the assistant can answer "what's on our plate this
    weekend?" from query_tasks rather than improvising around the gap.

    Tool count went 10 -> 16, still under the REQ-P018 grouping threshold.
  tasks:
    - id: "2.1"
      task: Task read tools — query_tasks and get_family_members
      status: completed
      details: |
        chatbotReaders/taskReader.ts. Filters: status, scope, assigneeId,
        unassignedOnly, overdueOnly, dueBefore/dueAfter, includeSnoozed, tags,
        searchQuery, limit (default 50, hard max 200).
        Returns count (total matches) separately from the capped sample, a
        summary computed over the FULL match set, and appliedFilters so an
        empty result is distinguishable from a narrow filter.
        isOverdue and isSnoozed are computed server-side so the model never does
        date math; a done task with a past due date is not overdue.
        Snoozed tasks are excluded by default, matching the task board — a tool
        that disagrees with the UI about what is "on the list" is worse than no
        tool.
      scope_finding: |
        TaskScope 'personal' is NOT a privacy boundary. GET /tasks returns
        getAllTasks(familyId) with no user filter, so both household members
        already see every personal task in the UI; the distinction governs
        leaderboard credit only. The tool therefore exposes nothing the
        requesting user cannot already see. Recorded in the reader's docblock
        because the opposite reading is the natural one.

    - id: "2.2"
      task: Trip read tools — list_trips and get_trip_itinerary
      status: completed
      details: |
        chatbotReaders/tripReader.ts. getItinerary returns a day-by-day agenda
        keyed by date, each day carrying stayingAt plus that day's stops.
        Stays are night-based (TRIP-ITINERARIES-BRD D2: endDate is the LAST
        night), so the agenda expands a stay inclusively across every night it
        covers and the model is told not to recompute it. An exclusive bound
        silently loses a night; mutation-verified.
        Stop lines normalise across the four stop types — fields that do not
        apply are null rather than absent, and transit stops carry name=null by
        design since they are described by their endpoints.

    - id: "2.3"
      task: Project read tools — list_projects and get_project
      status: completed
      details: |
        chatbotReaders/projectReader.ts. Per-category breakdown with resolved
        names, budgeted/hasBudget, spent, and line items.
        Within one project the category rows reconcile to totalSpent (asserted),
        so that total is safe to state. Across projects they do not — see D12.
        An orphaned categoryId renders as "Unknown category (<id>)" rather than
        a bare id; this app is known to produce orphans.
        Line items are estimate-only: PROJECTS-BRD §5.5.5 puts linking a line
        item to a transaction out of scope, so no line item ever carries a
        `spent` field, and a test asserts it stays that way.

    - id: "2.4"
      task: Family-member resolution behind one narrow module
      status: completed
      details: |
        chatbotReaders/familyMemberReader.ts. See D11 — this is the only AI path
        to the global `families` blob. describeAssignee() returns
        {userId, name, unresolved} so that "unassigned" and "assigned to someone
        no longer in the family" cannot collapse into the same output
        (SEC-P033); both have name=null, and reporting the orphan as "nobody is
        assigned" would be a confident false statement.

    - id: "2.5"
      task: Re-validate the prompt-cache breakpoint against the grown tool list
      status: completed
      details: |
        Breakpoint still sits on the final tool and nowhere else; order is
        stable across calls (read capabilities in registration order, then
        platform tools). Asserted in capabilityRegistry.test.ts, which also
        carries a tripwire that fails if the flat list passes 20 tools — when
        it fires, the answer is REQ-P018 grouping, not a raised number.

    - id: "2.6"
      task: Teach the system prompt the new domains and the tag rule
      status: completed
      details: |
        chatbotPrompt.ts: the read-access sentence now names all four domains,
        plus a "Tasks, trips & projects" paragraph and an "Attribution by tag"
        paragraph. The latter sits alongside the existing savings-vs-spending
        and rollup paragraphs — same class of cross-cutting rule whose violation
        produces a plausible wrong number.

    - id: "2.7"
      task: Security coverage
      status: completed
      details: |
        planningReads.security.test.ts — 24 tests across cross-family
        isolation, assignee resolution, task filtering, night-based stays, and
        tag overlap. Four guards mutation-verified:
          - cross-family scoping (fall-back-to-first-family bug)
          - SEC-P031 removed-transaction filter in projectReader
          - inclusive stay expansion
          - unresolved-vs-unassigned collapse
        Two further mutations were rejected by the compiler before reaching the
        suite (unused param, unused import), which is a stronger result than a
        test failure but not a substitute for one — hence the compiling
        variants above.
        capabilityRegistry.test.ts extended with domain coverage, dataClass
        classification, the REQ-P018 tripwire, and assertions that every
        tag-money tool states the non-additive rule in prose AND names the flag.
        That last assertion caught a real weakness: get_project had deferred the
        caveat by reference ("same caveats as list_projects") instead of stating
        it, which a model reading that tool alone would not follow.

phase_3_confirmed_writes:
  status: in_progress
  description: |
    The T1 action set per BRD §9. Task and transaction-metadata writes are
    delivered along with the SEC-P030 semantic-validation machinery; trip,
    project and financial writes remain.
  tasks:
    - id: "3.1"
      task: Task write actions — update_task, complete_task
      status: completed
      details: |
        update_task re-uses updateTaskSchema exported from routes/tasks.ts
        (REQ-P011), adding only taskId, which the HTTP route carries in its URL
        path rather than its body.
        complete_task is permanently T1 per BRD §9.2 and deliberately narrow: it
        completes and nothing else. A general set_task_status would be the same
        tier and no harder to build, but would let a mis-parsed instruction
        cancel work rather than finish it, and cancellation is what a user is
        least likely to catch while skimming a card.
        Re-completing an already-done task is refused: it would append a second
        transition and re-stamp completedAt, moving the task in the
        leaderboard's eyes for something that already happened.

    - id: "3.2"
      task: Trip and project write actions
      status: pending
      details: |
        Add/move a stop, create a line item. Stay-overlap validation must run
        server-side via tripHelpers.ts, never in the tool.

    - id: "3.3"
      task: Transaction metadata actions — set_transaction_category, set_transaction_description
      status: completed
      details: |
        dataClass 'metadata' — the only class SEC-P003 permits to become T2 —
        so these are the flagship candidates for Phase 5. Shipped as T1 because
        REQ-P081 blocks promotion until undo and the activity log exist.
        Write targets go through getTransactions, which applies excludeRemoved.
        Plaid leaves replaced pending holds in storage as status:'removed'; they
        are invisible everywhere in the UI, so editing one is a change the user
        can never see, find, or undo. Mutation-verified by reading raw storage.
        Neither action can touch an amount. Splits, manual transactions and
        budget figures are dataClass 'financial' and permanently outside T2.

    - id: "3.4"
      task: Remaining transaction writes — split, hide/unhide, rules, budget amounts
      status: pending
      details: |
        All T1, all dataClass 'financial' or 'content'. Auto-categorization
        rules are forward-acting (one write changes all future categorization)
        and are never T2.

    - id: "3.5"
      task: First describeCurrent implementations (SEC-P011)
      status: completed
      details: |
        The hook had existed since Phase 1 with no production caller, because
        both shipped actions were creates and had nothing to overwrite.
        An update shows only the fields it replaces — a before/after row for
        something that is not changing is noise that makes the changing rows
        harder to see, which is the legibility failure §5.2 guards against.
        A currently-blank value renders as "(none)" rather than an empty string:
        an empty string renders as absence, which reads as "not part of this
        change" instead of "currently blank".
        A describeCurrent that throws degrades to no comparison rather than
        failing the proposal; the semantic pass is what rejects a bad id.

    - id: "3.6"
      task: Semantic validation at confirm time (SEC-P030)
      status: completed
      details: |
        See D13 for placement. The orphaned-categoryId case is the one the
        requirement was written for: stored categoryIds in this app are already
        known to go orphaned, with their own cleanup scripts and a documented
        cell-vs-modal mismatch.
        Every guard has a positive control alongside it, so a check cannot
        degrade into blanket-deny and still pass.
        Cross-family and bank-removed records are both reported as simply not
        found; a test fails if a real title or merchant name reaches the error
        message.

    - id: "3.7"
      task: Answer Q-P03 with a real bulk card
      status: pending
      details: |
        Now ANSWERABLE rather than blocked: set_transaction_category makes a
        40-row recategorization card real. Requires a human to look at one on a
        phone, so it is QA rather than code.

phase_4_activity_log_and_undo:
  status: in_progress
  description: |
    Durable undo handles, user-facing activity log, bulk undo. Backend
    delivered; the UI is outstanding.

    This phase gates Phase 5 deliberately — SEC-P001 (one-click reversibility)
    is unenforceable until undo exists, so unattended writes cannot ship before
    the thing that makes them survivable.
  tasks:
    - id: "4.1"
      task: Durable undo handles recording prior state per affected record
      status: completed
      details: |
        chatActions/undoSnapshot.ts defines the capability; each action
        implements capture/read/restore. See D14 and D15.
        The snapshot holds the FULL prior record rather than a diff: a diff has
        to be interpreted at restore time against a record that may have moved
        on, and interpreting it wrong writes a state that never existed.
        Captured BEFORE execute, while the prior value still exists; a capture
        failure costs the undo and is recorded honestly rather than blocking a
        write the user already approved.
        Undoing a CREATE is the one destructive reversal, and the fingerprint
        check is doing real work there: deleting a task the household has since
        filled in is the worst outcome this feature could produce.

    - id: "4.2"
      task: Activity store and undo service
      status: completed
      details: |
        actionActivityStore.ts — per-family JSON at ai_activity_{familyId},
        180-day retention applied on write, 2000-entry cap, oldest evicted
        first. Longer than the 30-day trace window on purpose: a trace answers
        "why did it do that", asked within days; the log answers "what did it
        change", asked when someone notices a number looks wrong, which can be
        a quarter later.
        Recording never fails the write it records — the change is already
        applied, so an error there would invite the user to redo done work.
        actionUndoService.ts owns REQ-P027. Rows unwind in reverse order of
        application, so a create-then-modify batch leaves no intermediate state.

    - id: "4.3"
      task: Activity and undo HTTP routes
      status: completed
      details: |
        routes/aiActivity.ts, mounted at /api/v1/ai. Separate router from
        chatbot.ts partly for size but mostly for boundary: nothing here talks
        to the model, and keeping it out of the file that builds tool surfaces
        makes it harder to wire one to the other by accident.
        Behind the same refuseBusinessWorkspace guard (D17).
        `before` values are stripped from the list response: the log shows what
        a row did, and the prior value is an implementation detail of undo.

    - id: "4.4"
      task: User-facing activity log UI
      status: pending
      details: |
        REQ-P037's surface, plus REQ-P026's inline undo for recent batches.
        Deferred to a separate change so it can be spot-checked before landing.

    - id: "4.5"
      task: Mark unattended writes wherever the record is displayed
      status: pending
      details: |
        REQ-P039. Nothing to mark until a T2 automation exists, so this lands
        with Phase 5 rather than here.

    - id: "4.6"
      task: Persist the proposal store
      status: pending
      details: |
        REQ-P028 / REQ-P082 / TD-030. The in-memory Map is acceptable for
        conversation-scoped cards on a single PM2 process; it is not acceptable
        for a queue a background agent writes to and a human reviews hours
        later. Must land before Phase 5/6. Note that issueProposal and
        consumeProposal are synchronous today, so this is a sync-to-async change
        across the confirm route and the chat loop, not a storage swap.

phase_5_unattended_tier:
  status: not_started
  description: |
    Standing-consent settings, caps, kill switch. First T2 automation is
    transaction categorization. Exit: an automation can be enabled, produces
    marked writes, and is bulk-undoable.
  tasks:
    - id: "5.1"
      task: Per-automation standing consent
      status: pending
      details: |
        REQ-P030-P033. Off by default, plain-language copy, attributed enable/
        disable, a single global kill switch independent of per-automation
        toggles, and no queued work executing after a toggle flips off.
        There is deliberately no global "let the AI act" switch.

    - id: "5.2"
      task: Rate and batch caps per automation
      status: pending
      details: |
        REQ-P034-P036. Exceeding a cap disables the automation and notifies
        rather than truncating or continuing. Runs must be idempotent with
        respect to their trigger.

    - id: "5.3"
      task: First T2 automation — transaction categorization on data arrival
      status: pending
      details: |
        Triggered post-Plaid-sync rather than on a schedule (Q-P04): it bounds
        volume to what actually changed and makes idempotency natural. Builds on
        AI-CATEGORIZATION-BRD. Adding it requires editing the REQ-P015 hardcoded
        T2 list, which is the point.

    - id: "5.4"
      task: Per-capability model selection in the registry
      status: pending
      details: |
        REQ-P054. Neither ReadCapability nor ChatActionDefinition carries a
        model field today; every model is hardcoded at its call site
        (chatbotService, categorizationService, both Amazon adapters). Nothing
        depends on it until a background workload exists, which is why it lands
        here rather than in Phase 1.

phase_6_proactive_reads:
  status: not_started
  description: |
    Scheduled digests and insight generation. May queue proposals for later
    approval; never writes. Exit: the background budget holds and chat is never
    starved.
  tasks:
    - id: "6.1"
      task: Scheduled digest and insight generation
      status: pending

    - id: "6.2"
      task: Queued proposals reviewable hours later
      status: pending
      details: |
        Depends on 4.3 — an in-memory nonce store cannot hold a proposal across
        a restart, let alone across a review delay.

open_questions:
  - id: Q-P03
    question: Does the plan-card legibility threshold (25 rows) hold in practice on mobile?
    status: open
    plan: Validate during Phase 3 with a real 40-row recategorization (task 3.6).

deferred_and_tracked_elsewhere:
  - TD-029 — agent learnings have no redaction pass
  - TD-030 — the proposal store is in-memory (REQ-P028, task 4.3)
