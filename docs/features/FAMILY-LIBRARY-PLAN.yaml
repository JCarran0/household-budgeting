# =============================================================================
# Family Library — Implementation Plan
# =============================================================================
# BRD: docs/features/FAMILY-LIBRARY-BRD.md
# Status: Phase 1 in progress — import tooling complete; reader and tools not started
# Last Updated: 2026-10-17
# =============================================================================

overview:
  description: |
    How the library described in the BRD gets built. Phase 1 is a
    read-only, text-only document library: ingested by the maintainer through
    Claude Code, stored under the data prefix, and answered from by the
    assistant with mandatory citations. No Google credential enters the app.

    Phases 2+ (Facts, Money links, Estate documents) are directional in the
    BRD roadmap and get their own refinement pass before build.

  key_files:
    brd: docs/features/FAMILY-LIBRARY-BRD.md
    read_only_data_service: backend/src/services/readOnlyDataService.ts
    chatbot_data_service: backend/src/services/chatbotDataService.ts
    read_capabilities: backend/src/services/capabilities/readCapabilities.ts
    redaction: backend/src/utils/redaction.ts
    storage_precedent: backend/src/services/imageStore.ts
    validators: backend/src/validators/libraryValidators.ts
    document_redaction: backend/src/utils/documentRedaction.ts
    library_script: backend/src/scripts/library-document.ts
    import_skill: .claude/skills/import-document/SKILL.md

decisions:
  - id: D1
    date: 2026-10-17
    decision: Core job is find-the-facts-fast (arbitrary Q&A over documents).
    rationale: |
      BRD D-F01. Reframed from "never miss a date" by the maintainer during
      discovery. Structured facts and reminders move to Phase 2 and are seeded
      from the library.

  - id: D2
    date: 2026-10-17
    decision: |
      Phase 1 ingest is text-only via a Claude Code command; the app never
      holds a Google credential.
    rationale: |
      BRD D-F02. Considered and rejected for Phase 1: a service account on a
      shared Drive folder (1–2 days, long-lived key in SSM) and per-user OAuth
      (drive.readonly is a restricted scope: 7-day refresh tokens in Testing,
      security review in Production). Text-only validates usage first.

  - id: D3
    date: 2026-10-17
    decision: Freshness is re-run on demand, diffed on Drive modifiedTime.
    rationale: BRD D-F03.

  - id: D4
    date: 2026-10-17
    decision: |
      Shape-based redaction at ingest with typed markers
      ([REDACTED:<type> …last4]) and per-document counts in frontmatter. No
      reversible mapping.
    rationale: |
      BRD D-F04. The marker refinement came from the maintainer: the agent
      should be able to tell what the source contains even when the value is
      withheld. The reversible variant was rejected because it recreates the
      sensitive store redaction exists to avoid.

  - id: D5
    date: 2026-10-17
    decision: |
      Scope: vehicles, home, major purchases, health plan summaries. Excluded:
      tax, medical, IDs/passports, estate.
    rationale: BRD D-F05. Estate docs are a dedicated later phase, not dropped.

  - id: D6
    date: 2026-10-17
    decision: |
      Citations mandatory; figures quoted verbatim; "the documents don't say"
      is valid; golden set of ~10 questions.
    rationale: BRD D-F06.

  - id: D7
    date: 2026-10-17
    decision: |
      No inventory phase. Import per document through /import-document,
      starting with solar and Rivian R2 documents; golden questions are
      collected per import with human-supplied answers.
    rationale: BRD D-F07.

  - id: D8
    date: 2026-10-17
    decision: |
      Library entries are JSON keys (library_{familyId}_{docId}) in the
      existing StorageAdapter, not markdown files under a new path; no
      catalog file; evals at library_evals_{familyId}_{docId}.
    rationale: |
      BRD D-F08. Found while grounding the design in the storage layer:
      StorageAdapter.list is prefix-based and JSON-only, and sync:production,
      backup:local, versioning and snapshots all operate on it. Markdown
      objects would have needed BinaryObjectStore plus a list method; a
      catalog would have needed a remote merge on every push.

phase_1_library:
  status: completed
  tasks:
    - id: P1-1
      title: Library document format
      status: completed
      description: |
        backend/src/validators/libraryValidators.ts. JSON keys in the existing
        storage layer (D8); domain enum enforces scope; page markers must be
        1..pageCount; recorded redaction counts must match body markers; the
        meta schema refuses fields the script derives. Tests:
        libraryValidators.test.ts.

    - id: P1-2
      title: Typed redaction
      status: completed
      description: |
        backend/src/utils/documentRedaction.ts composes redaction.ts and adds
        SSN (delimited, or labeled undelimited), Luhn-valid card, labeled
        routing, and bank account on bank-context lines only. SSN keeps no
        digits. Tests: documentRedaction.test.ts, including what is KEPT
        (VIN, policy no., customer account no., phone, figures).

    - id: P1-3
      title: library script + /import-document skill
      status: completed
      description: |
        `npm run library -- families|prepare|evals|list|push`
        (src/scripts/library-document.ts) and
        .claude/skills/import-document/SKILL.md. prepare/evals write local data
        only; push is the maintainer's gated production write and re-validates.
        Refuses the business workspace, duplicate sources, and docId reuse
        across sources; skips unchanged sources. Smoke-tested against a scratch
        DATA_DIR.

    - id: P1-4
      title: Import first corpus
      status: completed
      description: |
        Solar documents and Rivian R2 extended service/warranty documents via
        /import-document, with golden questions answered by the maintainer.
      outcome: |
        2026-10-18: six documents in production — sunrun-solar-lease,
        sunrun-cap-package (amends the lease), central-hudson-interconnection-agreement,
        rivian-r2-vehicle-service-contract, rivian-r2-preferred-vehicle-protection,
        rivian-r2-purchase-agreement — with 17 golden questions. Answers came from
        a Sonnet + Fable cross-check on the source PDFs, all 17 in agreement and
        approved by the maintainer (REQ-F044). Skipped as redundant: the Rivian
        transaction receipt (same figures as the purchase agreement p.1) and the
        DocuSign signing log.

    - id: P1-5
      title: Library reader (read side)
      status: completed
      description: |
        Family-scoped reader over the library_{familyId}_ prefix, exposed
        through ReadOnlyDataService. Validates every entry on read; fails
        closed when familyId is absent (SEC-F004). Must never read
        library_evals_ keys.

    - id: P1-6
      title: Assistant tools
      status: completed
      description: |
        list_documents (metadata minus body) and read_document as T0
        capabilities. Tool descriptions carry REQ-F040–F043. Decide the
        page-range parameter once the first corpus shows real document sizes.
      outcome: |
        services/chatbotReaders/libraryReader.ts + capabilities/libraryCapabilities.ts.
        Page range decided: read_document takes optional startPage/endPage and
        returns at most 60,000 chars per call, with truncated/nextStartPage.
        First corpus: the 44-page lease (~101k chars) and the VSC take two
        calls, everything else one. ReadOnlyDataService gained a single
        family-scoped listing, listLibraryKeys(familyId) — deliberately not a
        general listKeys(prefix). Entries are validated on read and reported
        as unreadable on failure; amendedBy is derived so the amended
        document points at what supersedes it.

    - id: P1-7
      title: Golden set runner
      status: completed
      description: |
        Script (in git) that loads library_evals_ keys (not in git), asks the
        assistant each question, and reports pass/fail with the cited source.
      outcome: |
        backend/scripts/library-golden.ts (`npm run library:golden -- --family <id>`).
        Local data only. Scores each answer three ways: an Opus judge against the
        approved answer, a deterministic verbatim-figure check (REQ-F041;
        helpers in src/utils/goldenScoring.ts, unit-tested), and the trace
        ledger for which documents were opened and which page was cited.
        First run 2026-10-18, Sonnet: 17/17 passed, $1.57 total, median
        $0.08/question, max $0.27 (proving the absence of the Sunrun account
        number read the whole lease plus the CAP package).

  acceptance:
    - Golden set passes
    - Business workspace cannot reach library tools
    - No document content or golden answers in git history

open_questions:
  - Estate document handling model — Phase 4 refinement

deferred_and_tracked_elsewhere:
  - Phase 2 Facts (Assets, Agreements, obligations → tasks/push) — own refinement pass
  - Phase 3 Money links — own refinement pass
  - In-app upload / Drive sync — triggered by non-maintainer demand (BRD §2)
